<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Club de Leones de Tibás</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <div class="modal fade show d-block" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel"
       aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-4 border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 flex-column align-items-center">
          <img src="../img/logotibas.png" alt="Logo Club de Leones de Tibás" class="mb-3"
               style="width:80px;height:80px;border-radius:12px;object-fit:contain"
               onerror="this.style.display='none'">
          <h5 class="modal-title fw-bold text-accent" id="loginModalLabel">Club de Leones Tibás</h5>
          <p class="text-muted mb-0">Acceso al sistema interno</p>
        </div>

        <div class="modal-body">
          <form id="loginForm" action="#" method="post" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Usuario o correo</label>
              <input type="text" class="form-control" id="username" name="username"
                     placeholder="Ingrese su usuario" required>
              <div class="invalid-feedback">
                Por favor ingrese su usuario o correo.
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Ingrese su contraseña" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                        title="Mostrar contraseña">
                  👁️
                </button>
                <div class="invalid-feedback">
                  Por favor ingrese su contraseña.
                </div>
              </div>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
              <label class="form-check-label" for="rememberMe">Recordarme en este dispositivo</label>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Ingresar</button>
            </div>
          </form>

          <div class="mt-3 text-center">
            <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
          </div>

          <div class="mt-3 text-center">
            <a href="index.html" class="small text-decoration-none">Volver al inicio</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_LOGIN = '../api/login.php';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const toggle = document.getElementById('togglePassword');
      const pwd = document.getElementById('password');
      const user = document.getElementById('username');

      if (!form || !pwd || !toggle || !user) {
        return;
      }

      toggle.addEventListener('click', () => {
        if (pwd.type === 'password') {
          pwd.type = 'text';
          toggle.textContent = '🙈';
          toggle.title = 'Ocultar contraseña';
        } else {
          pwd.type = 'password';
          toggle.textContent = '👁️';
          toggle.title = 'Mostrar contraseña';
        }
      });

      form.addEventListener('submit', async ev => {
        ev.preventDefault();

        const usuario = user.value.trim();
        const password = pwd.value.trim();

        if (!usuario || !password) {
          form.classList.add('was-validated');
          return;
        }

        try {
          const res = await fetch(API_LOGIN, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, password })
          });

          const data = await res.json();

          if (data.ok) {
            sessionStorage.setItem('usuario', data.usuario);
            window.location.href = 'menu_socio.html';
          } else {
            alert(data.mensaje || 'Usuario o contraseña incorrectos');
          }
        } catch (err) {
          alert('No se pudo validar el usuario en este momento');
        }
      });
    });
  </script>
</body>

</html>
